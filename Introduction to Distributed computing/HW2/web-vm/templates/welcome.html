<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f0f2f5; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; margin: auto; text-align: center; }
        .logout { float: right; text-decoration: none; color: red; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/logout" class="logout">Logout</a>
        <h2>Welcome, {{.Username}}!</h2>
        <p>Authentication was successful.</p>
        <hr>
        <h3>File successfully retrieved via RPC from VM3:</h3>
        <img src="/fetch-image" alt="Image from VM3" style="max-width: 100%; border: 1px solid #ccc; padding: 5px;">
    </div>
</body>
</html>
